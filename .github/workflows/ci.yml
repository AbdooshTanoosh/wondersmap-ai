
name: WondersMap AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wondersmap
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: wondersmap_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wondersmap -d wondersmap_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      WONDERSMAP_TEST_DATABASE_URL: postgresql+psycopg://wondersmap:ci_test_password@127.0.0.1:5432/wondersmap_test_db

      # Application configuration for CI only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wondersmap_test_db
      POSTGRES_USER: wondersmap
      POSTGRES_PASSWORD: ci_test_password
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      OPENAI_API_KEY: ci-placeholder-not-used

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build
